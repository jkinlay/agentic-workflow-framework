{
  "version": 3,
  "template": {
    "expected_workflow_version": "1.8.0"
  },
  "project": {
    "id": "00000000-0000-0000-0000-000000000000",
    "name": "CHANGE_ME_PROJECT",
    "short_name": "CHANGE_ME"
  },
  "jira": {
    "site": "https://CHANGE_ME.invalid",
    "project_key": "EX",
    "scope": {
      "allow_entire_project": false,
      "selector_mode": "all",
      "included_epics": [],
      "labels_any": [],
      "components_any": [],
      "additional_jql": "",
      "ownership_required": true
    },
    "status_map": {
      "backlog": "Backlog",
      "ready": "Ready",
      "in_progress": "In Progress",
      "in_review": "In Review",
      "done": "Done"
    },
    "dependency_direction": "requires",
    "mutations_owner": "controller"
