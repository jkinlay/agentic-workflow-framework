{
  "version": 3,
  "template_version": "1.8.0",
  "live_side_effects_supported": false,
  "states": [
    "BACKLOG",
    "READY",
    "DISPATCHED",
    "IN_PROGRESS",
    "PR_DRAFT",
    "READY_FOR_CRITIC",
    "CHANGES_REQUESTED",
    "AMENDING",
    "SPECIALIST_REVIEW",
    "FINAL_REVIEW",
    "READY_FOR_OWNER_AUTHORIZATION",
    "OWNER_AUTHORIZED",
    "MERGING",
    "MERGE_UNKNOWN",
    "MERGED",
    "MERGED_PENDING_JIRA",
    "DONE",
    "BLOCKED",
    "FAILED",
    "CANCELLED",
    "SUPERSEDED",
    "REOPENED"
  ],
  "terminal_states": [
    "CANCELLED",
    "DONE",
    "SUPERSEDED"
  ],
  "resume_states": [
    "CHANGES_REQUESTED",
    "FINAL_REVIEW",
    "IN_PROGRESS",
    "MERGED_PENDING_JIRA",
    "READY",
    "READY_FOR_CRITIC",
    "SPECIALIST_REVIEW"
  ],
  "normal_transitions": [
    {
      "from": "BACKLOG",
      "event": "TICKET_READY",
      "to": "READY",
      "actor": "controller",
      "requires": [
        "config_valid",
        "scope_verified",
        "ownership_claimed",
        "dependencies_satisfied",
        "contract_ready"
      ]
    },
    {
      "from": "READY",
      "event": "DISPATCH_ACCEPTED",
      "to": "DISPATCHED",
      "actor": "controller",
      "requires": [
        "dispatch_permitted",
        "lease_current",
        "budget_reserved",
        "ownership_current"
      ]
    },
    {
      "from": "DISPATCHED",
      "event": "WORKER_STARTED",
      "to": "IN_PROGRESS",
      "actor": "controller",
      "requires": [
        "run_registered",
        "worktree_verified"
      ]
    },
    {
      "from": "IN_PROGRESS",
      "event": "WORKER_COMPLETED",
      "to": "PR_DRAFT",
      "actor": "controller",
      "requires": [
        "worker_result_valid",
        "branch_pushed",
        "pr_exists"
      ]
    },
    {
      "from": "PR_DRAFT",
      "event": "PR_READY",
      "to": "READY_FOR_CRITIC",
      "actor": "controller",
      "requires": [
        "validation_current",
        "draft_cleared",
        "requirements_current"
      ]
    },
    {
      "from": "READY_FOR_CRITIC",
      "event": "CRITIC_REJECTED",
      "to": "CHANGES_REQUESTED",
      "actor": "controller",
      "requires": [
        "review_current"
      ]
    },
    {
      "from": "CHANGES_REQUESTED",
      "event": "AMENDMENT_ACCEPTED",
      "to": "AMENDING",
      "actor": "controller",
      "requires": [
        "dispatch_permitted",
        "lease_current",
        "budget_reserved",
        "ownership_current"
      ]
    },
    {
      "from": "AMENDING",
      "event": "AMENDMENT_COMPLETED",
      "to": "READY_FOR_CRITIC",
      "actor": "controller",
      "requires": [
        "worker_result_valid",
        "validation_current",
        "new_head_registered"
      ]
    },
    {
      "from": "READY_FOR_CRITIC",
      "event": "CRITIC_APPROVED_SPECIALISTS",
      "to": "SPECIALIST_REVIEW",
      "actor": "controller",
      "requires": [
        "critic_current",
        "specialists_required"
      ]
    },
    {
      "from": "READY_FOR_CRITIC",
      "event": "CRITIC_APPROVED_FINAL",
      "to": "FINAL_REVIEW",
      "actor": "controller",
      "requires": [
        "critic_current",
        "no_specialists_required"
      ]
    },
    {
      "from": "SPECIALIST_REVIEW",
      "event": "SPECIALIST_REJECTED",
      "to": "CHANGES_REQUESTED",
      "actor": "controller",
      "requires": [
        "review_current"
      ]
    },
    {
      "from": "SPECIALIST_REVIEW",
      "event": "SPECIALISTS_APPROVED",
      "to": "FINAL_REVIEW",
      "actor": "controller",
      "requires": [
        "specialists_current",
        "critic_current"
      ]
    },
    {
      "from": "FINAL_REVIEW",
      "event": "FINAL_GATE_PASSED",
      "to": "READY_FOR_OWNER_AUTHORIZATION",
      "actor": "controller",
      "requires": [
        "derived_gate_ready",
        "requirements_current"
      ]
    },
    {
      "from": "READY_FOR_OWNER_AUTHORIZATION",
      "event": "OWNER_AUTHORIZED",
      "to": "OWNER_AUTHORIZED",
      "actor": "controller",
      "requires": [
        "authorization_verified",
        "request_unused",
        "gate_current"
      ]
    },
    {
      "from": "OWNER_AUTHORIZED",
      "event": "MERGE_STARTED",
      "to": "MERGING",
      "actor": "controller",
      "requires": [
        "executor_certified",
        "atomic_candidate_protocol",
        "permit_consumed",
        "gate_current"
      ]
    },
    {
      "from": "MERGING",
      "event": "MERGE_OBSERVED",
      "to": "MERGED",
      "actor": "controller",
      "requires": [
        "merge_confirmed",
        "candidate_matched"
      ]
    },
    {
      "from": "MERGE_UNKNOWN",
      "event": "MERGE_OBSERVED",
      "to": "MERGED",
      "actor": "controller",
      "requires": [
        "merge_confirmed",
        "candidate_matched"
      ]
    },
    {
      "from": "MERGE_UNKNOWN",
      "event": "NO_MERGE_CONFIRMED",
      "to": "FINAL_REVIEW",
      "actor": "controller",
      "requires": [
        "no_merge_confirmed",
        "external_state_current",
        "old_permit_revoked"
      ]
    },
    {
      "from": "MERGED",
      "event": "JIRA_UNAVAILABLE",
      "to": "MERGED_PENDING_JIRA",
      "actor": "controller",
      "requires": [
        "merge_confirmed"
      ]
    },
    {
      "from": "MERGED",
      "event": "JIRA_RECONCILED",
      "to": "DONE",
      "actor": "controller",
      "requires": [
        "merge_confirmed",
        "jira_done_confirmed",
        "dependencies_refreshed"
      ]
    },
    {
      "from": "MERGED_PENDING_JIRA",
      "event": "JIRA_RECONCILED",
      "to": "DONE",
      "actor": "controller",
      "requires": [
        "merge_confirmed",
        "jira_done_confirmed",
        "dependencies_refreshed"
      ]
    },
    {
      "from": "FAILED",
      "event": "RECOVERABLE_FAILURE",
      "to": "BLOCKED",
      "actor": "controller",
      "requires": [
        "failure_recoverable",
        "blocker_recorded"
      ]
    },
    {
      "from": "REOPENED",
      "event": "REOPEN_DISPOSITION",
      "to": "CANCELLED",
      "actor": "controller",
      "requires": [
        "owner_disposition",
        "successor_recorded"
      ]
    }
  ],
  "invalidation_events": [
    "AUTHORIZATION_REVOKED",
    "BASE_CHANGED",
    "BASE_RETARGETED",
    "BLOCKING_THREAD_REOPENED",
    "CI_FAILED",
    "CI_UNAVAILABLE",
    "HEAD_CHANGED",
    "MERGE_METHOD_CHANGED",
    "POLICY_CHANGED",
    "REQUIREMENTS_CHANGED"
  ],
  "control_events": [
    "BLOCK",
    "BRANCH_DELETED",
    "CANCEL",
    "FAIL",
    "MANUAL_MERGE_OBSERVED",
    "MERGE_TIMEOUT",
    "PR_CLOSED",
    "RECOVER",
    "REVERT_OBSERVED",
    "REVIEW_DISMISSED",
    "SUPERSEDE"
  ],
  "unspecified_event_policy": "reject",
  "terminal_invalidation_policy": "audit_without_state_change",
  "merge_uncertainty_policy": "reconcile_before_retry",
  "implementation": ".agentic/lib/agentic/lifecycle.py"
}
