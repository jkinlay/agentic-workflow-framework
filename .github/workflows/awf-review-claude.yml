name: AWF Claude independent review

# Split model/publisher adapter (docs/providers/claude-code-action.md).
#
# - Runs from the BASE branch definition (pull_request_target); a pull request
#   cannot change this file or the adapter code it runs.
# - The model job holds a read-only GITHUB_TOKEN and the model credential only.
#   It checks the pull-request head out as data and never executes it.
# - The publisher job contains no model, holds a per-run token for the dedicated
#   AWF Reviewer App (pull_requests: write, metadata: read), and posts exactly
#   one COMMENT review bound to the reviewed head SHA.
# - Same-repository branches only: on a public repository pull_request_target
#   would otherwise run this workflow, with its credential, for any fork.
# - Every third-party action is pinned to a commit SHA resolved on 2026-08-30
#   and must be re-verified by a human before activation.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: awf-review-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWF_REVIEW_DIR: .agentic/review/claude
  AWF_SCHEMA: .agentic/schemas/review-report.schema.json
  AWF_POLICY: .agentic/project.yaml

jobs:
  model:
    name: awf/review-claude-model
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ github.event.pull_request.head.sha }}
      reviewer_identity: ${{ steps.policy.outputs.reviewer_identity }}
    steps:
      - name: Check out base-branch adapter code and policy (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Check out pull-request head as data (never executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Read reviewer configuration from protected policy
        id: policy
        run: python3 "$AWF_REVIEW_DIR/policy.py" --policy "$AWF_POLICY" --engine claude >> "$GITHUB_OUTPUT"

      - name: Build review input (diff, changed files, task contract; no title/body)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 "$AWF_REVIEW_DIR/build_input.py"
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --pr-dir pr
          --task-contract "${{ steps.policy.outputs.task_contract_path }}"
          --execution-report "${{ steps.policy.outputs.execution_report_path }}"
          --out input.json

      - name: Run model (this job has no GitHub write credential)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ steps.policy.outputs.base_url }}
        run: >-
          python3 "$AWF_REVIEW_DIR/run_model.py"
          --in input.json
          --schema "$AWF_SCHEMA"
          --model "${{ steps.policy.outputs.model }}"
          --reviewer-identity "${{ steps.policy.outputs.reviewer_identity }}"
          --out report.json
          --meta-out report-meta.json

      - name: Upload report (kept even when the model job fails, as evidence)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: awf-review-report-${{ github.event.pull_request.head.sha }}
          path: |
            report.json
            report-meta.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: awf/review-claude-publish
    needs: model
    if: needs.model.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out base-branch publisher code and policy (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Download the validated report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: awf-review-report-${{ needs.model.outputs.head_sha }}

      - name: Mint a short-lived token for the dedicated AWF Reviewer App
        id: reviewer-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AWF_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AWF_REVIEWER_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Require the App identity to match protected policy
        env:
          APP_SLUG: ${{ steps.reviewer-app.outputs.app-slug }}
          EXPECTED: ${{ needs.model.outputs.reviewer_identity }}
        run: |
          if [ "${APP_SLUG}[bot]" != "$EXPECTED" ]; then
            echo "reviewer App '${APP_SLUG}[bot]' does not match policy identity '$EXPECTED'" >&2
            exit 1
          fi

      - name: Publish a COMMENT review bound to the reviewed head SHA
        env:
          GH_TOKEN: ${{ steps.reviewer-app.outputs.token }}
        run: >-
          python3 "$AWF_REVIEW_DIR/publish.py"
          --report report.json
          --schema "$AWF_SCHEMA"
          --repo "${{ github.repository }}"
          --pr "${{ github.event.pull_request.number }}"
          --expected-head "${{ needs.model.outputs.head_sha }}"
          --reviewer-identity "${{ needs.model.outputs.reviewer_identity }}"
          --policy "$AWF_POLICY"
