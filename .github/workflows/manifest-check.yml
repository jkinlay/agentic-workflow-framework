name: manifest-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Open same-repository pull request to synchronize with its base
        required: true
        type: number

permissions:
  contents: read

jobs:
  manifest:
    if: github.event_name != 'workflow_dispatch'
    concurrency:
      group: manifest-check-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes "--only-binary=:all:" -r requirements.txt
      - name: Rehearse PR base sync with manifest driver
        if: github.event_name == 'pull_request'
        run: python -B scripts/manifest_merge_driver.py --merge-ref "${{ github.event.pull_request.base.sha }}"
      - name: Verify committed manifest bytes
        run: python -B scripts/build_release.py --check-manifest

  sync-pull-request:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: manifest-sync-pr-${{ inputs.pull-request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve and validate pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pull-request }}
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER)
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            if (pull.state !== 'open') {
              throw new Error(`pull request ${pull_number} is not open`)
            }
            if (pull.head.repo.full_name !== repository) {
              throw new Error('manifest synchronization cannot push to a fork')
            }
            if (pull.base.ref !== context.payload.repository.default_branch) {
              throw new Error('manifest synchronization requires the default branch as its base')
            }
            core.setOutput('base_sha', pull.base.sha)
            core.setOutput('head_ref', pull.head.ref)
            core.setOutput('head_sha', pull.head.sha)
      - name: Check out trusted merge tooling from the PR base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ steps.pr.outputs.base_sha }}
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: candidate
          ref: ${{ steps.pr.outputs.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synchronize pull request branch with manifest driver
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_ref }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -B ../trusted/scripts/manifest_merge_driver.py --sync-ref "$BASE_SHA" --push-branch "$HEAD_BRANCH"
