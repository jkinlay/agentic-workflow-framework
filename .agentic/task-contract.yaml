task_id: github:jkinlay/agentic-workflow-framework#9
issue_key: AWF-023
issue_title: "Human handoff: GitHub terminal notification and external browser"
objective: Define the merge-ready GitHub notification contract and consolidate Claude review publication to minimize notification noise.
repository: github:jkinlay/agentic-workflow-framework
base_ref: 6974271
authorization:
  principal: github:jkinlay
  evidence: Direct repository-owner instruction on 2026-08-31 expanding PR #10 to the GitHub notification and consolidated-review scope.
allowed_paths:
  - .agentic-workflow/distribution-manifest.yaml
  - .agentic/execution-report.json
  - .agentic/project.yaml
  - .agentic/review/claude/publish.py
  - .agentic/review/claude/tests/test_claude_adapter.py
  - .agentic/task-contract.yaml
  - .agentic/workflow.lock.yaml
  - ARCHITECTURE.md
  - README.md
  - docs/GETTING_STARTED.md
  - docs/HUMAN_MERGE_HANDOFF.md
  - docs/IMPLEMENTATION_PLAN.md
  - docs/OPERATING_MODEL.md
  - docs/SYSTEM_ARCHITECTURE.md
  - docs/UPGRADING.md
  - docs/providers/claude-code-action.md
  - scaffolds/project/.agentic/project.yaml.template
  - scaffolds/project/placeholders.yaml
  - scaffolds/providers/claude/.agentic/review/claude/publish.py
  - scaffolds/providers/claude/.agentic/review/claude/tests/test_claude_adapter.py
  - tests/test_human_merge_handoff.py
forbidden_paths:
  - all paths not listed in allowed_paths
dependencies: []
acceptance_criteria:
  - AC1: The terminal handoff is impossible until every same-head readiness condition passes.
  - AC2: The complete issue title comes from mandatory trusted task-contract fields, never PR text or generated summary.
  - AC3: The GitHub adapter posts exactly one deterministic @jkinlay merge-ready comment per repository, PR, and head SHA.
  - AC4: The external browser opens only after the GitHub notification succeeds or its exact same-head marker is verified.
  - AC5: AWF has no mail adapter and emits no intermediate terminal notification.
  - AC6: Claude publishes all findings in one COMMENT review body with no inline comments, while identity, permissions, validation, idempotency, and head binding remain unchanged.
  - AC7: Normative documentation, version metadata, installed/scaffold parity, and dogfood provenance are consistent.
required_checks:
  - python -m unittest discover -s tests -p 'test_*.py' -v
  - python -m unittest discover -s .agentic/review/claude/tests -p 'test_*.py' -v
  - git diff origin/main...HEAD --check
required_context:
  - AGENTS.md
  - ARCHITECTURE.md
  - docs/REVIEW_POLICY.md
  - docs/HUMAN_MERGE_HANDOFF.md
approval_points:
  - Human review before merge.
budget:
  currency: owner-configured-provider-limit
  maximum: inherited
deliverables:
  - AWF 0.1.2 PR #10
  - terminal GitHub notification contract
  - consolidated Claude review publisher
  - deterministic tests and regenerated dogfood lock
